[package]
name = "cross_agent_session_resumer"
version = "0.5.0"
edition = "2024"
description = "Cross Agent Session Resumer — resume AI coding sessions across providers (CLI binary: casr)"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/cross_agent_session_resumer"
keywords = ["cli", "agent", "session", "resume", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

# Originally intended to publish on crates.io as `casr`, but that short
# name is held by an unrelated project (anfedotoff's CASR crash analyzer),
# so the package itself goes out under the longer canonical name. All the
# internal `casr::...` crate-path references throughout main.rs/tests/etc
# stay on the short name because we keep `casr` as both the lib name (for
# `casr::*` paths) and the binary entry point.
[lib]
name = "casr"
path = "src/lib.rs"

[[bin]]
name = "casr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jiff = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
dirs = "7"
glob = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
which = "8"
rich_rust = "0.2.3"
rayon = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build", "cargo"] }
