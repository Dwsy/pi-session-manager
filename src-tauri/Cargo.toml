[package]
name = "pi-session-manager"
version = "0.6.91"
edition = "2021"
default-run = "pi-session-manager"

[[bin]]
name = "pi-session-manager"
path = "src/main.rs"
required-features = ["gui"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater"]
cli = []
custom-protocol = ["tauri?/custom-protocol"]

[dependencies]
tauri = { version = "2.10.1", features = ["devtools", "image-png", "tray-icon", "webview-data-url"], optional = true }
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-dialog = { version = "2.6.0", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
dirs = "5.0"
lazy_static = "1.4"
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
notify = "6.1"
notify-debouncer-full = "0.3"
tokio-tungstenite = "0.21"
futures-util = "0.3"
log = "0.4"
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.9"
async-stream = "0.3.6"
flate2 = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2.2"
tempfile = "3.14"
urlencoding = "2.1"
sha2 = "0.10"
getrandom = "0.2"
casr = { package = "cross_agent_session_resumer", path = "crates/casr" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
trash = "5.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
font-kit = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14", features = ["source-fontconfig"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
unused_mut = "allow"
unused_extern_crates = "allow"
unused_crate_dependencies = "allow"
unreachable_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"

[dev-dependencies]
tempfile = "3.10"
reqwest = { version = "0.12", features = ["json"] }
