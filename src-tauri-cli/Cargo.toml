[package]
name = "pi-session-cli"
version = "0.6.91"
edition = "2021"

[[bin]]
name = "pi-session-cli"
path = "src/main.rs"

[dependencies]
# Reuse business logic from the main crate (cli feature = no Tauri)
pi-session-manager = { path = "../src-tauri", default-features = false, features = ["cli"] }

reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

portable-pty = "0.9"
notify = "6.1"
notify-debouncer-full = "0.3"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

[features]
default = []
