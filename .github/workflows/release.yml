name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - platform: macos-latest
            target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin --bundles app,dmg"
            cli_artifact: pi-session-cli-macos-arm64
            cli_binary: pi-session-cli
          # macOS x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin --bundles app,dmg"
            cli_artifact: pi-session-cli-macos-x64
            cli_binary: pi-session-cli
          # Linux x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: "--bundles appimage,deb,rpm"
            cli_artifact: pi-session-cli-linux-x64
            cli_binary: pi-session-cli
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: "--bundles msi,nsis"
            cli_artifact: pi-session-cli-windows-x64.exe
            cli_binary: pi-session-cli.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup show
          echo "$(rustc --print sysroot)/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version sync
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/release-version.mjs check "${GITHUB_REF_NAME#v}"
          else
            node scripts/release-version.mjs check
          fi

      # ── Frontend (shared by both Desktop and CLI) ──────────
      - name: Build frontend
        run: pnpm run build

      - name: Verify Windows Authenticode configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_SIGN_CERT_SHA1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNTOOL_PATH) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_SHA1) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_TIMESTAMP_URL)) {
            Write-Error 'Windows Authenticode signing secrets are required for release builds'
          }

      - name: Build Tauri desktop app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_SIGN_CERT_SHA1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pi Session Manager ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.tauri_args }}

      - name: Validate Windows Authenticode artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($artifacts.Count -eq 0) { throw 'No Windows executable or MSI artifacts found for Authenticode validation' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            Write-Host "$($artifact.FullName): $($signature.Status)"
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($artifact.FullName)" }
            if ($null -eq $signature.TimeStamperCertificate) { throw "Missing Authenticode timestamp: $($artifact.FullName)" }
          }

      # ── CLI binary ────────────────────────────────────────
      - name: Build CLI binary
        run: cargo build --release --target ${{ matrix.target }} -p pi-session-cli

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p cli-dist
          cp target/${{ matrix.target }}/release/${{ matrix.cli_binary }} cli-dist/${{ matrix.cli_artifact }}
          chmod +x cli-dist/${{ matrix.cli_artifact }}
          shasum -a 256 cli-dist/${{ matrix.cli_artifact }} > cli-dist/${{ matrix.cli_artifact }}.sha256

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cli-dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" "cli-dist/${{ matrix.cli_artifact }}"
          $hash = (Get-FileHash "cli-dist/${{ matrix.cli_artifact }}" -Algorithm SHA256).Hash
          "$hash  ${{ matrix.cli_artifact }}" | Out-File -FilePath "cli-dist/${{ matrix.cli_artifact }}.sha256" -Encoding ASCII

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.cli_artifact }}
          path: cli-dist/*
          retention-days: 7

  # ── Finalize Release ─────────────────────────────────────
  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: cli-artifacts
          merge-multiple: true

      - name: Fix CLI permissions
        run: |
          for f in cli-artifacts/pi-session-cli-*; do
            if [ -f "$f" ] && [[ ! "$f" =~ \.sha256$ ]] && [[ ! "$f" =~ \.exe$ ]]; then
              chmod +x "$f"
            fi
          done

      - name: Download updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-metadata
          gh release download "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir release-metadata
          cp release-metadata/latest.json release-metadata/updater.json

      - name: Validate updater platforms
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('release-metadata/latest.json').read_text())
          platforms = set(data.get('platforms', {}).keys())
          print('Updater platforms:', ', '.join(sorted(platforms)))

          required_any = {
              'darwin-aarch64': {'darwin-aarch64-app', 'darwin-aarch64'},
              'darwin-x86_64': {'darwin-x86_64-app', 'darwin-x86_64'},
              'linux-x86_64': {'linux-x86_64', 'linux-x86_64-appimage'},
              'windows-x86_64': {'windows-x86_64', 'windows-x86_64-msi', 'windows-x86_64-nsis'},
          }

          missing = {
              name: sorted(candidates)
              for name, candidates in required_any.items()
              if platforms.isdisjoint(candidates)
          }

          if missing:
              print('Missing required updater platforms:')
              for name, candidates in missing.items():
                  print(f'  - {name}: expected one of {candidates}')
              raise SystemExit(1)
          PY

      - name: Prepare channel manifests
        run: |
          node scripts/update-channel-manifests.mjs \
            prepare \
            release-metadata/latest.json \
            channel-manifests \
            "${GITHUB_REF_NAME}"

      - name: Publish channel manifests branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p manifest-publish
          cd manifest-publish
          git init -b update-manifests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin update-manifests || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -B update-manifests FETCH_HEAD
          fi
          mkdir -p stable beta
          cp ../channel-manifests/beta/latest.json beta/latest.json
          git add beta/latest.json
          if [ -f ../channel-manifests/stable/latest.json ]; then
            cp ../channel-manifests/stable/latest.json stable/latest.json
            git add stable/latest.json
          fi
          if git diff --cached --quiet; then
            echo "No channel manifest changes"
            exit 0
          fi
          git commit -m "chore: update channel manifests for ${VERSION}"
          git push origin update-manifests

      - name: List release assets
        run: |
          ls -lhR cli-artifacts/
          ls -lhR release-metadata/

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ['VERSION']
          version = tag.removeprefix('v')
          repository = os.environ['REPOSITORY']

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(
              rf'^## \[{re.escape(version)}\].*?\n(?=^## \[|\Z)',
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )

          body = [f'## Pi Session Manager {version}', '']
          if match:
              lines = match.group(0).strip().splitlines()
              body.extend(lines[1:])
          else:
              prev_tag = subprocess.run(
                  ['git', 'describe', '--tags', '--abbrev=0', 'HEAD~1'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).stdout.strip()
              body.extend(['### What\'s Changed', ''])
              if prev_tag:
                  log = subprocess.run(
                      ['git', 'log', '--pretty=format:- %s', f'{prev_tag}..HEAD'],
                      text=True,
                      stdout=subprocess.PIPE,
                      check=True,
                  ).stdout.strip()
                  body.append(log or '- See commit history')
              else:
                  body.append('- Initial release')

          prev_tag = subprocess.run(
              ['git', 'describe', '--tags', '--abbrev=0', 'HEAD~1'],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              check=False,
          ).stdout.strip()
          if prev_tag:
              body.extend(['', f'**Full Changelog**: https://github.com/{repository}/compare/{prev_tag}...{tag}'])

          body.extend([
              '',
              '---',
              '',
              '### Desktop App (GUI)',
              '',
              'Full-featured desktop application with Tauri.',
              '',
              '| Platform | File |',
              '|----------|------|',
              f'| macOS (Apple Silicon) | `Pi.Session.Manager_{version}_aarch64.dmg` |',
              f'| macOS (Intel) | `Pi.Session.Manager_{version}_x64.dmg` |',
              '| Windows | `.exe` / `.msi` installer |',
              '| Linux | `.deb` / `.rpm` / `.AppImage` |',
              '',
              '### CLI Server (Headless)',
              '',
              'Lightweight server with embedded web UI. No GUI dependencies needed.',
              'Ideal for remote servers, Docker, or headless environments.',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| macOS (Apple Silicon) | `pi-session-cli-macos-arm64` |',
              '| macOS (Intel) | `pi-session-cli-macos-x64` |',
              '| Linux (x64) | `pi-session-cli-linux-x64` |',
              '| Windows (x64) | `pi-session-cli-windows-x64.exe` |',
              '',
              'Each CLI binary ships with a matching `.sha256` checksum file.',
              '',
              '#### CLI Quick Start',
              '',
              '```bash',
              'chmod +x pi-session-cli-*',
              './pi-session-cli-*',
              '',
              '# Open http://localhost:52131 in your browser',
              '```',
              '',
              '#### CLI Configuration',
              '',
              'Create `~/.config/pi-session-manager.json` (Linux) or `~/Library/Application Support/pi-session-manager.json` (macOS):',
              '',
              '```json',
              '{',
              '  "http_port": 52131,',
              '  "bind_addr": "0.0.0.0",',
              '  "auth_enabled": true',
              '}',
              '```',
              '',
              '### Requirements',
              '',
              '- **Desktop**: macOS 11+, Windows 10+, or Linux with WebKitGTK 4.1',
              '- **CLI**: No special requirements (statically links SQLite)',
              '- [Pi](https://github.com/nickviper/pi-mono) for terminal integration',
          ])

          Path('release-notes.md').write_text('\n'.join(body).rstrip() + '\n', encoding='utf-8')
          PY

          echo "Generated release notes:"
          sed -n '1,80p' release-notes.md

      - name: Update release with CLI assets and notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pi Session Manager ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            cli-artifacts/*
            release-metadata/updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
